<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>AGENDA CON FLASK CRUD 1.6</title>
  <link rel="stylesheet" href="https://bootswatch.com/5/brite/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  {% with messages = get_flashed_messages() %} {% if messages %}
  {% for message in messages %}
  <div class="alert alert-info alert-dismissible fade show" role="alert">
    <strong>{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
  {% endif %} {% endwith %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">AGENDA</a>
      {% if session.get("user_id") %}
      <div class="d-flex">
        <div class="navbar-brand pe-3 pt-2">{{ session.get("user_id") }}</div>
          
        <!-- SWITCH DE TEMA -->
        <div class="form-check form-switch me-3 mt-2 d-flex align-items-center gap-2">
          <input class="form-check-input" type="checkbox" id="temaSwitch"
                {% if session.get('tema', 'claro') == 'oscuro' %}checked{% endif %}>
          <i id="temaIcon"
            class="bi {% if session.get('tema', 'claro') == 'oscuro' %}bi-sun-fill{% else %}bi-moon-stars-fill{% endif %}"
            style="font-size: 1.2rem; color: #ffffff;"></i>
        </div>

        <a href="{{url_for('logout')}}" class="btn btn-secondary my-2 my-sm-0" type="submit">Salir</a>
      </div>
      {% endif %}
    </div>
  </nav>

  <style>
  .form-check-input:checked {
    background-color: #ffffff !important;
  }
  </style>

</head>

<body data-bs-theme="{{ session.get('tema', 'light') }}">
  <div class="container pt-4">
    {% block body %}
    {% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
          crossorigin="anonymous"></script>

  <script src="{{url_for('static', filename='js/main.js')}}"></script>

  
  <script>
    // script para actualizar sin recargar la pagina
    document.addEventListener("DOMContentLoaded", () => {
      const temaSwitch = document.getElementById("temaSwitch");
      const temaIcon = document.getElementById("temaIcon");
      const body = document.body;

      if (temaSwitch && temaIcon && body) {
        temaSwitch.addEventListener("change", () => {
          const tema = temaSwitch.checked ? "dark" : "light";

          // Cambiar el atributo del body
          body.setAttribute("data-bs-theme", tema);

          // Cambiar el ícono
          if (tema === "dark") {
            temaIcon.classList.remove("bi-moon-stars-fill");
            temaIcon.classList.add("bi-sun-fill");
          } else {
            temaIcon.classList.remove("bi-sun-fill");
            temaIcon.classList.add("bi-moon-stars-fill");
          }

          // Guardar la preferencia en sesión del backend
          fetch("{{ url_for('cambiar_tema') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tema: tema }) // light o dark
          });
        });
      }
    });
  </script>

</body>
</html>
